# Promemoria mensile delle preferenze (fase F3 di TODO.md §8). INERTE (inizia per "_"): per attivarlo
# rinomina in promemoria_preferenze.yml, metti INGRESSI=on nel .env e riavvia. PRIMA compila
# "linkPreferenze" in services/componimessaggio_promemoriapreferenze.yml (finché è vuoto non parte
# nessuna mail) e rivedi il testo. Provalo su dev: lì SendMail manda tutto a marco@taffi.it e l'elenco
# è limitato a 3 membri (vedi Ghost.elencaMembri, "max").
#
# Il primo di ogni mese alle 9 prende da Ghost i membri SENZA nessuna label (cioè che non hanno compilato
# il form delle preferenze) e manda a ciascuno UNA mail. "unaVolta": ogni membro è segnato servito prima
# dell'invio, quindi un crash a metà non manda due volte la stessa mail (chi fallisce finisce in
# dead-letter e arriva un avviso). "ripetiOgniScadenza": sono gli stessi membri ogni mese, quindi l'elenco
# dei già serviti riparte a ogni scadenza.
sorgente: ghost_giraffiamo_elencaMembri
quando: "0 9 1 * *"
recuperaEntro: 3d
procedura: _promemoria_preferenze
consegna: unaVolta
ripetiOgniScadenza: true
suErrore: sendmail_marco
parametri:
  senzaLabel: true
  # DECISIONE DA PRENDERE: "subscribed:true" esclude chi si è disiscritto dalla newsletter su Ghost (il
  # membro resta registrato ma ha detto di non voler mail). Senza questa riga la mail arriva anche a loro.
  # Se sono mail di servizio e vanno a tutti, togli la riga.
  filtro: "subscribed:true"
