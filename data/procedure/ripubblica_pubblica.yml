name: ripubblica_pubblica
description: >
  Tappa 3 della sostituzione del canale ghost_giraffiamo con CanaleFlusso (2026-09-15): stessi
  identici 3 step di scrittura già usati dalla procedura "ripubblica" (condivisa con il vecchio
  canale Ghost diretto, qui NON toccata per non rischiare di romperla), più un quarto step finale
  che pubblica per davvero — vedi steps/ghost_pubblica.yml (riusa ghost_giraffiamo_post, stesso
  servizio Ghost già configurato in data/services/ghost_giraffiamo.yml: stesso sito, stesso
  autore di default, stesso status "draft"). Usata come flusso "principale" di
  ripubblica_giraffiamo.yml, quindi eseguita automaticamente dal feed, fino in fondo, senza
  chiedere conferma — esattamente come faceva prima ghost_giraffiamo con la pipeline Ghost
  diretta.
type: sequenziale
tasks:
  - name: ripubblica
    type: step
  - name: genera_titoli_ghost
    type: step
  - name: formatta_ghost
    type: step
  # Copertina autogenerata, in due stili diversi, solo se nessuno ne ha già indicata una:
  #  - EVENTO (tag "Eventi" assegnato da genera_titoli_ghost): sei medaglioni a incisione;
  #  - ARTICOLO: illustrazione ad acquerello dentro un tondo.
  # Tutti questi task sono "opzionale: true": se la generazione fallisce (API immagini non
  # raggiungibile, contenuto rifiutato...) l'articolo esce comunque, senza copertina, invece di
  # restare non pubblicato.
  - name: genera_prompt_cover_evento
    type: step
    opzionale: true
    condizione: &evento
      tutte:
        - campo: tags
          operatore: contains
          valore: Eventi
        - non:
            campo: feature_image
            operatore: truthy
  - name: genera_cover_evento
    type: step
    opzionale: true
    condizione: *evento
  - name: genera_prompt_cover
    type: step
    opzionale: true
    condizione: &articolo
      tutte:
        - campo: tags
          operatore: notContains
          valore: Eventi
        - non:
            campo: feature_image
            operatore: truthy
  - name: genera_cover
    type: step
    opzionale: true
    condizione: *articolo
  # Nome file e testo alternativo, guardando la copertina appena generata (vale per entrambi
  # gli stili: se non è stata generata nessuna copertina, il task viene saltato).
  - name: metadati_cover
    type: step
    opzionale: true
    condizione:
      campo: immagineGenerata
      modo: multimedia
      operatore: exists
  - name: ghost_pubblica
    type: step
  # (2026-09-18, richiesto da Marco) Notifica via mail dopo ogni pubblicazione automatica dal
  # feed — solo qui, non nei flussi "scrivi"/"invia" da chat (dove è Marco stesso a pubblicare).
  - name: componi_notifica_marco
    type: step
  - name: invia_notifica_marco
    type: step
