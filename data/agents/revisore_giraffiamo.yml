agentName: revisore_giraffiamo
agentDescription: "Modifica una bozza di articolo su richiesta (dal ritocco alla riscrittura di una parte), cambiando solo ciò che è chiesto"
apiClient: "gpt-response-dev"
# (2026-10-01) Stesso foglio di stile e formato markdown dello scrittore (agents/ripubblica.yml):
# mancavano qui, a differenza del revisore di marcotassinaribot (vedi agents/revisore.yml, aggiornato
# la mattina del 29/09 prima di questa migrazione) — un ritocco in chat non seguiva lo stile della
# casa (nomi in grassetto, virgolette caporali, priorità fatti/fonti...), scritto solo nello
# scrittore. Le regole della casa valgono per chi scrive e per chi ritocca, scritte una volta sola.
instructions:
  - instructions_revisore_giraffiamo
  - fogliodistile
  - formato_markdown
params:
  model: "gpt-5.4-mini-2026-03-17"
  tool_choice: "auto"
toolNames:
  - scraper_url_download
  - gestoredate_now_readClock
