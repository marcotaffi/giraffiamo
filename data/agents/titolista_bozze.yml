agentName: titolista_bozze
agentDescription: "titolista professionale, percorso a bozze"
# (2026-09-30) Copia di titolista.yml per il percorso a bozze (bozze_giraffiamo, vedi
# procedure/scrivi_giraffiamo.yml): stesse regole di titolo/slug/tag, MA senza i campi
# feature_image* (la copertina è sempre e solo generata o una delle cover fisse, mai decisa qui —
# vedi campiBrevi.image in services/bozze_giraffiamo.yml) e con "excerpt" al posto di
# "custom_excerpt" (bozze.ts si aspetta quel nome esatto, vedi CAMPI_REVISIONE in servizi/bozze.ts).
# File separato invece di riusare titolista.yml: quello resta quello della pipeline automatica dal
# feed (ripubblica_pubblica.yml), che non va toccata.
instructions:
  - instructions_titolista_bozze
params:
  model: "gpt-5.4-mini-2026-03-17"
  tool_choice: "none"
  type:
    - title
    - excerpt
    - slug
    - tags
