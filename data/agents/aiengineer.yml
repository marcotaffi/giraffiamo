# i blocchi html di apg23, che avrebbero sovrascritto quelle locali. Le istruzioni di
# formattazione per Ghost sono interamente nel file prompts/formatta_ghost.yml.
# assistant_id: "pmpt_69aeec913dd08197b18b6b535887894007a218ecd192ce50"
params:
  tool_choice: "none"
