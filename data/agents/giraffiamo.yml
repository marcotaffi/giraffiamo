agentName: giraffiamo
agentDescription: "Avatar telegram di Giraffiamo"
apiClient: "gpt-response-dev"
params:
  # Prima usavo "gpt-4o-mini": passato a gpt-5.4-mini (pinnato alla data per stabilità
  # e per restare nel gruppo idoneo ai token gratuiti del programma data-sharing OpenAI).
  model: "gpt-5.4-mini-2026-03-17"
  type: "text"
  temperature: 0.70
  top_p: 0.70 
  max_output_tokens: 6000
instructions:
           - giraffiamoinstructions
toolNames:
           - gestoredate_now_readClock
          # - scraper_url_download
           # websearch_italia_low riattivato il 2026-09-15, ma RISTRETTO al solo giraffiamo.it
           # (vedi data/services/websearch_italia_low.yml, opzioni.allowedDomains) — non una
           # ricerca web generica: resta vero che "il bot lavora solo su giraffiamo.it, non su
           # siti esterni" (vedi giraffiamoinstructions.md), questo è solo un secondo modo di
           # cercarci dentro, utile per la chat quando ghost_giraffiamo_elencaArticoli (la via
           # preferita per contenuti del sito, vedi Compito 3) non è la scelta più diretta.
           - websearch_italia_low
           - ghost_giraffiamo
           # Canale di prova (CanaleFlusso) per testare da chat ghost_giraffiamo_run/_post come
           # step di una procedura invece che come metodo fisso della sottoclasse Ghost — vedi
           # data/services/prova_ghost_giraffiamo.yml. Aggiunto il 2026-09-15: il canale era già
           # registrato all'avvio (bot.aggiungiCanali) ma senza questa riga non risultava mai
           # nell'elenco tool dell'AI — verificato nei log: "usa il tool di prova" chiamava
           # comunque ghost_giraffiamo_run (quello vero), perché l'unico tool disponibile con
           # quel nome era quello. La firma qui è quella PROPRIA del canale (come ghost_giraffiamo
           # sopra), non quella delle singole azioni esposte (canaleflusso_ghost_giraffiamo_scrivi/
           # _invia, vedi CanaleFlusso.generaDescrizione): creaEAvviaServizio cerca prima un
           # servizio già registrato con .firma identica a questa stringa esatta, lo trova
           # (registrato da aggiungiCanali) e riusa quello — un'altra firma qui creerebbe invece
           # un servizio NUOVO, mai configurato, quasi certamente un errore all'avvio.
           - prova_ghost_giraffiamo
