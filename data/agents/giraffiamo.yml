agentName: giraffiamo
agentDescription: "Avatar telegram di Giraffiamo"
apiClient: "gpt-response-dev"
params:
  # Prima usavo "gpt-4o-mini": passato a gpt-5.4-mini (pinnato alla data per stabilità
  # e per restare nel gruppo idoneo ai token gratuiti del programma data-sharing OpenAI).
  model: "gpt-5.4-mini-2026-03-17"
  type: "text"
  temperature: 0.70
  top_p: 0.70 
  max_output_tokens: 6000
instructions:
           - giraffiamoinstructions
toolNames:
           - gestoredate_now_readClock
           # Genera una cover nello stile del sito e la mostra in chat (procedure/genera_cover.yml).
           # NB: le cover degli articoli pubblicati automaticamente restano le 3 immagini neutre
           # scelte dal titolista (vedi instructions_titolista.md): questo tool serve a produrne
           # una nuova su richiesta, non cambia il flusso automatico.
           - proceduratool_coverdesigner
           # Variante per il lancio di un evento: sei medaglioni a incisione con i simboli
           # dell'evento (procedure/genera_cover_evento.yml).
           - proceduratool_coverdesigner_eventi
          # - scraper_url_download
           # websearch_italia_low riattivato il 2026-09-15, ma RISTRETTO al solo giraffiamo.it
           # (vedi data/services/websearch_italia_low.yml, opzioni.allowedDomains) — non una
           # ricerca web generica: resta vero che "il bot lavora solo su giraffiamo.it, non su
           # siti esterni" (vedi giraffiamoinstructions.md), questo è solo un secondo modo di
           # cercarci dentro, utile per la chat quando ghost_giraffiamo_elencaArticoli (la via
           # preferita per contenuti del sito, vedi Compito 3) non è la scelta più diretta.
           # AGGIORNATO (2026-09-16): da questo servizio l'AI vede ora solo le letture
           # (elencaArticoli, elencaRisorse) — "run"/"post" sono stati tolti dall'elenco tool
           # chiamabili in chat (vedi Ghost.azioniNonEsposteAllAI in taffitools/src/canali/ghost.ts),
           # restano solo per l'uso interno degli step di ripubblica_giraffiamo qui sotto.
           - websearch_italia_low
           - ghost_giraffiamo
           # ripubblica_giraffiamo (CanaleFlusso): dal 2026-09-15 è IL publisher automatico reale
           # per il CNV di giraffiamo.it (rinominato da "prova_ghost_giraffiamo" a cutover
           # completato — vedi data/services/ripubblica_giraffiamo.yml per la storia). Dal
           # 2026-09-16 è anche l'UNICO percorso chat per scrivere/pubblicare (vedi
           # giraffiamoinstructions.md, Compito 2): scrivi/invia come step separati, ciascuno
           # riusa "run"/"post" di ghost_giraffiamo internamente; "principale" come pipeline
           # completa (scrive e pubblica per davvero, senza conferma — stessa che gira già dal
           # feed) non è esposta in chat (vedi opzioni.esponiPrincipale in ripubblica_giraffiamo.yml).
           # Aggiunto il 2026-09-15: il canale era già registrato all'avvio (bot.aggiungiCanali)
           # ma senza questa riga non risultava mai nell'elenco tool dell'AI — verificato nei log.
           # La firma qui è quella PROPRIA del canale (come ghost_giraffiamo sopra), non quella
           # delle singole azioni esposte (canaleflusso_ghost_giraffiamo_scrivi/_invia, vedi
           # CanaleFlusso.generaDescrizione): creaEAvviaServizio cerca prima un servizio già
           # registrato con .firma identica a questa stringa esatta, lo trova (registrato da
           # aggiungiCanali) e riusa quello — un'altra firma qui creerebbe invece un servizio
           # NUOVO, mai configurato, quasi certamente un errore all'avvio.
           - ripubblica_giraffiamo
