name: linguaggio_giraffa
description: "Spiega cos'è il linguaggio giraffa, sintetizzando dal contenuto reale della pagina"
prompt: |
  L'utente ha cliccato "Come funziona il linguaggio giraffa?". Segui esattamente quanto descritto
  nel Compito 3 delle tue istruzioni generali per questa domanda: cerca la pagina con
  ghost_giraffiamo_elencaArticoli (resourceType:"pages", filter:"slug:linguaggio-giraffa",
  includi html nei fields), leggi l'html restituito e scrivi una sintesi breve — non inventare,
  non elencare tutto il contenuto, non incollare il testo della pagina. Segui le regole generali
  su tono, sinteticità e link (comprese le ancore alle sezioni, se pertinenti).
