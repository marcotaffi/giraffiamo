name: cose_giraffiamo
description: "Spiega cos'è Giraffiamo, sintetizzando dal contenuto reale della pagina"
prompt: |
  L'utente ha cliccato "Cos'è Giraffiamo?". Segui esattamente quanto descritto nel Compito 3
  delle tue istruzioni generali per questa domanda: cerca la pagina con
  ghost_giraffiamo_elencaArticoli (resourceType:"pages", filter:"slug:linguaggio-giraffa-portale",
  includi html nei fields), leggi l'html restituito e scrivi una sintesi breve — non inventare,
  non elencare tutto il contenuto, non incollare il testo della pagina. Segui le regole generali
  su tono, sinteticità e link (comprese le ancore alle sezioni, se pertinenti).
